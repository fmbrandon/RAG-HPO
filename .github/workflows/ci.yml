name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            lock: py311.txt
          - os: ubuntu-latest
            python: "3.12"
            lock: py312.txt
          - os: ubuntu-latest
            python: "3.13"
            lock: py313.txt
          - os: macos-latest
            python: "3.12"
            lock: py312.txt
          - os: windows-latest
            python: "3.12"
            lock: py312.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements/${{ matrix.lock }}
      - run: python -m pip install --require-hashes -r requirements/${{ matrix.lock }}
      - run: python -m pip install --no-deps -e .
      - run: pytest --cov=rag_hpo --cov-branch --cov-report=xml --cov-report=json:coverage.json
      - run: python scripts/check_coverage_targets.py coverage.json
      - run: python -m build
      - run: python -m pip check

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/py312.txt
      - run: python -m pip install --require-hashes -r requirements/py312.txt
      - run: python -m pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: nbqa ruff RAG-HPO.ipynb HPO_Vectorization.ipynb
      - run: mypy src/rag_hpo
      - run: bandit -c pyproject.toml -r src/rag_hpo
      - name: Detect secrets
        shell: bash
        run: |
          detect-secrets scan \
            --all-files \
            --exclude-files '(^|/)requirements(/|\.txt$)|.*\.(pptx|xlsx)$' > secrets-scan.json
          python -c "import json; data=json.load(open('secrets-scan.json')); raise SystemExit(bool(data['results']))"
      - run: pip-audit
      - name: License policy
        shell: bash
        run: |
          pip-licenses --format=json --output-file=licenses.json
          python scripts/check_licenses.py licenses.json
      - run: jupyter nbconvert --execute --to notebook --stdout RAG-HPO.ipynb > /dev/null
      - run: jupyter nbconvert --execute --to notebook --stdout HPO_Vectorization.ipynb > /dev/null
