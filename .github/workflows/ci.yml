name: CI

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/macos-py312.txt
      - run: python -m pip install --require-hashes -r requirements/macos-py312.txt
      - run: python -m pip install --no-deps -e .
      - run: pytest --cov=rag_hpo --cov-branch --cov-report=xml --cov-report=json:coverage.json
      - run: python scripts/check_coverage_targets.py coverage.json
      - run: python -m build
      - run: python -m pip check

  quality:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/macos-py312.txt
      - run: python -m pip install --require-hashes -r requirements/macos-py312.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/quality.py
