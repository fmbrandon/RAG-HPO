[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rag-hpo"
version = "0.2.0"
description = "Provider-neutral retrieval-augmented HPO annotation"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.14"
authors = [
  { name = "RAG-HPO contributors" },
]
dependencies = [
  "faiss-cpu>=1.9,<2",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.9,<3",
  "rapidfuzz>=3.9,<4",
  "sentence-transformers>=3,<6",
  "tabulate>=0.9,<1",
  "tiktoken>=0.8,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
vectorize = ["pronto>=2.6,<3"]
fastembed = ["fastembed>=0.4,<1"]
notebook = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
]
benchmark = ["openpyxl>=3.1,<4"]
test = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "pytest-mock>=3.14,<4",
  "responses>=0.25,<1",
]
dev = [
  "bandit>=1.7,<2",
  "build>=1.2,<2",
  "cyclonedx-bom>=6,<8",
  "detect-secrets>=1.5,<2",
  "hatchling>=1.27,<2",
  "mypy>=1.13,<3",
  "nbqa>=1.9,<2",
  "nbstripout>=0.8,<1",
  "pip-audit>=2.7,<3",
  "pip-licenses>=5,<6",
  "pip-tools>=7.4,<8",
  "pipdeptree>=2.23,<5",
  "pre-commit>=4,<5",
  "radon>=6,<7",
  "ruff>=0.8,<1",
  "vulture>=2.14,<3",
]

[project.scripts]
rag-hpo = "rag_hpo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_hpo"]

[tool.hatch.build]
include = [
  "src/rag_hpo/**/*.py",
  "src/rag_hpo/data/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "live: requires an explicitly configured live provider",
  "network: requires network access",
]

[tool.coverage.run]
branch = true
source = ["rag_hpo"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rag_hpo"]

[tool.bandit]
exclude_dirs = ["tests"]
