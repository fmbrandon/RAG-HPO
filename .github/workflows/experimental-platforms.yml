name: Experimental Linux and Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[vectorize,test]"
      - run: python -m pip install build
      - run: pytest
      - run: python -m build
      - run: python -m pip check
