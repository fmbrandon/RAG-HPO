repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: '(^|/)requirements(/|\.txt$)|\.(pptx|xlsx)$|^artifacts/|^benchmarks/'

  - repo: local
    hooks:
      - id: quality
        name: Full quality suite
        entry: .venv/bin/python scripts/quality.py --fast
        language: system
        pass_filenames: false
        stages: [pre-push]
